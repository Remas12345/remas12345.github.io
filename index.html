<script>

function applyLang(lang){
if(lang === 'ar'){
document.body.dir = "rtl";
document.getElementById("title").innerText = "ريماس الشهراني";
document.getElementById("role").innerText = "خريجة نظم معلومات";

}

function setLang(lang){
localStorage.setItem("lang", lang);
applyLang(lang);
}

window.onload = function(){
let saved = localStorage.getItem("lang") || "en";
applyLang(saved);
}

</script>
